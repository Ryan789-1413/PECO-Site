  intro: >-
    We manufacture our own chemical formulations in Salt Lake City, with direct oversight of
    consistency, performance and supply. Each PECO product belongs to a numbered series built
    for one kind of system.
  notes:
    - Expedited production for short lead times.
    - Hands-free delivery and transfer directly into your on-site storage tanks.
