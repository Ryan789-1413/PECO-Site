# ── Tanks (Peabody submittal drawings, Ryan, Oct 15, 2026) ──────────────────────
- id: gemini-dual-containment-tanks
  name: Gemini² dual containment tanks
  category: tanks
  brand: Peabody Engineering
  order: 1
  summary: Dual containment chemical tanks in 20, 40, 70 and 120 gallon sizes.
  description:
    - >-
      Each tank holds chemical in a primary tank set inside a secondary tank, for atmospheric
      service. A plugged port gives access to the space between them for interstitial leak
      detection.
    - >-
      The 120 gallon tank is also available in other materials and colors, with an FRP wrap,
      or in a configuration that meets NSF/ANSI 61.
  includes:
    - 8 in. vented twist lid
    - Two 2 in. FNPT spin-weld fittings with plugs
    - Pump suction connection
    - Interstitial leak detection port
  table:
    caption: Gemini² tank sizes
    columns: [Capacity, Footprint, Overall height, Material]
    rows:
      - [20 gal, 18 × 18 in., About 23⅝ in., HDPE]
      - [40 gal, 18 × 18 in., About 41¾ in., '—']
      - [70 gal, 24 × 24 in., About 39⅞ in., LLDPE with UV inhibitor]
      - [120 gal, 32 × 32 in., About 49¾ in., 'LPE (167 gal secondary)']
  gaps:
    - 40 gal tank material and weight (the submittal drawing contradicts itself)

