name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: astro check, tsc, ESLint, Prettier
        run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 7
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke, accessibility (axe) and redirect-file tests
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  links:
    name: Link check (lychee)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Absolute links to https://pecowater.com (canonical, og:url) point at the
      # old WordPress site until cutover, so they are excluded. Internal links are
      # root-relative and still checked against dist/. Remove the exclude after cutover.
      # /api/site-survey/ is the contact form's Pages Function (Phase 4); drop that exclude then.
      - uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --root-dir ${{ github.workspace }}/dist
            --no-progress
            --max-retries 3
            --accept 200..=299,429
            --exclude '^https://pecowater\.com'
            --exclude '/api/site-survey/?$'
            './dist/**/*.html'

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Lighthouse (performance >= 0.95, accessibility = 1.00)
        run: npm run lhci
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
